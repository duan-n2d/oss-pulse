name: oss_pulse
version: "0.1.0"
config-version: 2
profile: oss_pulse

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Analysis window, counted back from `as_of` (defaults to today, UTC).
  window_days: 365
  as_of: null
  # A PR with no human response after this many hours counts as unanswered.
  unanswered_after_hours: 168

models:
  oss_pulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    observability:
      +materialized: table
      +schema: observability

flags:
  send_anonymous_usage_stats: false

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-pulse"
version = "0.1.0"
description = "Review latency, merge rate, maintainer concentration and adoption for data-ecosystem open source"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=2.0,<3",
  "dbt-core>=1.10,<1.13",
  "dbt-duckdb>=1.10,<1.12",
  "pyarrow>=18",
  "requests>=2.32",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
oss-pulse = "oss_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
